name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Train and release linear model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for changes in training_data.csv
        id: check_changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- training_data.csv | grep -q .; then
              changed=true
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            # Treat the initial push to a new repository as a data change.
            changed=true
          elif git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- training_data.csv | grep -q .; then
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "training_data.csv changed: $changed"

      - name: Train linear model
        if: steps.check_changes.outputs.changed == 'true'
        run: python train_model.py

      - name: Upload model output
        if: steps.check_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linear-model-run-${{ github.run_number }}
          path: |
            linear_model.txt
            linear_model.pkl

      - name: Commit model and push release branch
        if: github.event_name == 'push' && steps.check_changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add linear_model.txt
          git commit -m "Generate new model [skip ci]"

          git checkout --orphan temp_release
          git rm -rf .
          git checkout main -- linear_model.txt
          git add linear_model.txt
          git commit -m "Update linear model"
          git push --force origin temp_release:release

      - name: Create GitHub release
        if: github.event_name == 'push' && steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" \
            --target release \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated release generated by CI/CD pipeline." \
            "./linear_model.txt"
